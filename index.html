function bottom(){return '<div class="bottom">'+[["today","Hoy"],["itinerary","Ruta"],["map","Mapa"],["budget","¥"],["reservations","Reservas"]].map(([v,l])=>'<button class="'+(view===v?'on':'')+'" onclick="nav(\''+v+'\')">'+l+'</button>').join("")+'</div>'}
function today(){const d=days[selected],done=d.acts.filter((_,j)=>state[key("a"+selected+"-"+j)]).length;return '<div class="top"><div><div class="ey">'+d.d+'</div><h1>'+d.city+'</h1><div class="sub">'+d.jp+' · '+d.title+'</div></div></div><div class="hero" style="background-image:url(\''+d.img+'\')"><div><span class="pill">'+d.d+'</span><h2>'+d.title+'</h2></div></div><div class="grid g3"><div class="card"><div class="ey">Hotel</div><div class="metric">'+money(d.hotelY)+'</div><p>'+d.hotel+'</p></div><div class="card"><div class="ey">Transporte</div><div class="metric">'+money(d.trans.reduce((s,t)=>s+t[3],0))+'</div><p>Estimado por persona.</p></div><div class="card"><div class="ey">Progreso</div><div class="metric">'+Math.round(done/d.acts.length*100)+'%</div><div class="progress"><i style="width:'+Math.round(done/d.acts.length*100)+'%"></i></div></div></div><section class="sec"><h3 class="sect">Qué hacer</h3><div class="timeline">'+d.acts.map((a,j)=>'<div class="act"><div class="time">'+a[0]+'</div><div><b>'+a[1]+'</b>'+(a[2]?'<span class="jp">'+a[2]+'</span>':'')+'<p>'+a[3]+'</p></div><button class="check '+(state[key("a"+selected+"-"+j)]?'done':'')+'" onclick="mark('+selected+','+j+')">✓</button></div>').join("")+'</div><button class="btn red todaydone" onclick="markDay('+selected+')">Día de hoy completado</button></section><section class="sec"><h3 class="sect">Cómo llegar</h3>'+d.trans.map(t=>'<div class="tr"><b>'+t[0]+': '+t[1]+'</b><small>'+t[2]+' · <span class="price">'+money(t[3])+'</span></small></div>').join("")+'</section>'}
function itinerary(){return '<div class="top"><div><div class="ey">6 dic 2026 → 5 ene 2027</div><h1>Ruta completa</h1></div></div><div class="days">'+days.map((d,i)=>'<div class="day" onclick="openDay('+i+')"><div><strong>'+d.d.slice(5)+'</strong><small>'+d.d.slice(0,4)+'</small></div><div><strong>'+d.city+'</strong><small>'+d.jp+' · '+d.title+'</small></div><span class="badge">'+(state[key("d"+i)]?'✓ completo':'plan')+'</span></div>').join("")+'</div>'}
function mapPage(){return '<div class="top"><div><div class="ey">Mapa interactivo</div><h1>Japón, punto por punto</h1></div></div><div class="mapgrid"><div id="map"></div><div class="card mapdetail"><div class="ey">Ruta</div><h3>Kansai → Kyūshū → Tokyo → norte</h3><p>Toca un punto para abrir ese día.</p></div></div>'}
function initMap(){if(view!=="map"||!document.getElementById("map")||typeof L==="undefined")return;map=L.map("map").setView([36.4,136.5],5);L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:18,attribution:"© OpenStreetMap"}).addTo(map);const coords=[];days.forEach((d,i)=>{coords.push([d.lat,d.lng]);const m=L.circleMarker([d.lat,d.lng],{radius:7,color:"#081018",weight:2,fillColor:i>=13?"#6fb5ff":"#ef5a4a",fillOpacity:1}).addTo(map);m.bindPopup("<b>"+d.city+"</b><br>"+d.jp+"<br>"+d.d+"<br><button onclick=\"openDay("+i+")\">Abrir día</button>")});L.polyline(coords,{color:"#ef5a4a",weight:4,opacity:.82,dashArray:"7 7"}).addTo(map)}
function budgetPage(){const total=budget.reduce((s,x)=>s+x[1],0);return '<div class="top"><div><div class="ey">Estimación</div><h1>Presupuesto</h1><div class="sub">¥1 ≈ COP '+JPY_COP+'.</div></div></div><div class="grid g3"><div class="card"><div class="ey">Japón / persona</div><div class="metric">¥'+Math.round(total).toLocaleString("es-CO")+'</div><p>~COP '+Math.round(total*JPY_COP).toLocaleString("es-CO")+'</p></div><div class="card"><div class="ey">Vuelos intl.</div><div class="metric">~COP '+Math.round(flightCostCOP).toLocaleString("es-CO")+'</div><p>Comprados.</p></div><div class="card"><div class="ey">Colchón</div><div class="metric">+15%</div></div></div><section class="sec">'+budget.map(x=>'<div class="barrow"><b>'+x[0]+'</b><div class="bar"><i style="width:'+x[2]+'%"></i></div><span>'+money(x[1])+'</span></div>').join("")+'</section>'}
function reservationsPage(){return '<div class="top"><div><div class="ey">Antes de viajar</div><h1>Reservas críticas</h1></div></div><div class="res">'+reservations.map((r,i)=>'<div class="r"><button class="check '+(state[key("r"+i)]?'done':'')+'" onclick="state[key(\'r'+i+'\')]=!state[key(\'r'+i+'\')];save();render()">✓</button><div><b>'+r[0]+'</b><small style="display:block">'+r[1]+' · '+r[2]+'</small></div><a class="btn" href="'+r[3]+'" target="_blank">Abrir</a></div>').join("")+'</div>'}
function render(){if(!user){document.getElementById("app").innerHTML='<div class="modal"><div class="box"><div class="ey">日本 2026</div><h1 style="font-size:42px">¿Quién eres?</h1><p class="sub">Sin autenticación. El progreso queda guardado localmente por usuario.</p><div class="users"><button onclick="setUser(\'Yulian\')">Yulian</button><button onclick="setUser(\'Daniel\')">Daniel</button></div></div></div>';return}const body=view==="today"?today():view==="itinerary"?itinerary():view==="map"?mapPage():view==="budget"?budgetPage():reservationsPage();document.getElementById("app").innerHTML='<div class="wrap">'+side()+'<main class="main">'+head()+body+'</main>'+bottom()+'</div>';if(view==="map")setTimeout(initMap,30)}
window.openDay=openDay;window.nav=nav;window.mark=mark;window.markDay=markDay;window.setUser=setUser;window.save=save;render();
</script></body></html>
